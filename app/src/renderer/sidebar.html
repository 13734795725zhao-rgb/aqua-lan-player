<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>sidebar</title>
  <link rel="stylesheet" href="shared/base.css" />
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>
  <!--
    窗口宽度在动画中会从 320 → 0，所以内容必须「贴右、定宽」：
    窗口变窄时内容被从左侧裁掉，视觉上就是整块向右滑出。
  -->
  <aside class="sidebar" id="root">
    <header class="head">
      <!-- 工具条：分割按钮（主区开选择器 / 箭头出「最近·固定」菜单） -->
      <div class="toolbar">
        <div class="split" id="split">
          <button class="pick-main" id="pick">
            <span class="icon"></span><span class="pick-label">选择文件夹…</span>
          </button>
          <button class="pick-arrow" id="pick-menu" title="最近与固定">
            <span class="icon"></span>
          </button>
        </div>
        <div class="spacer"></div>
        <button class="tb-btn" id="btn-mode" title="播放模式"></button>
        <button class="tb-btn" id="btn-sort" title="排序"></button>
        <button class="tb-btn" id="btn-view" title="显示选项"></button>
        <button class="tb-btn" id="collapse" title="收起 (Ctrl+B)"></button>
      </div>

      <!-- 浮动菜单（最近/固定、排序、显示选项、播放模式共用） -->
      <div class="pop" id="pop" hidden></div>

      <div class="search" id="search">
        <span class="icon search-ico"></span>
        <input id="filter" placeholder="过滤" spellcheck="false" />
        <button class="clear" id="clear" hidden></button>
      </div>

      <!-- 面包屑：替代被截断的路径文本 -->
      <div class="crumbs" id="crumbs"></div>

      <div class="meta">
        <span id="count">0 项</span>
        <span class="dot">·</span>
        <label class="chk">
          <input type="checkbox" id="recursive" />
          <span class="box"></span>
          <span>子文件夹</span>
        </label>
        <button class="link" id="unhide" hidden>显示已隐藏</button>
      </div>
    </header>

    <div class="viewport" id="viewport">
      <div class="canvas" id="canvas"></div>
      <div class="scrollbar" id="scrollbar"><div class="thumb" id="thumb"></div></div>
      <div class="empty" id="empty">
        <div class="empty-art"></div>
        <div class="empty-title">还没有视频</div>
        <div class="empty-sub">点击上方「选择文件夹…」导入目录</div>
      </div>
      <div class="toast" id="toast" hidden></div>
    </div>

    <div class="resizer" id="resizer"></div>
  </aside>

  <script src="shared/icons.js"></script>
  <script src="shared/hotkeys.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
